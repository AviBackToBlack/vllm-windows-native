name: Managed vLLM runtime materialization regression

on:
  workflow_dispatch:
# Intentionally no pull_request trigger: this workflow downloads and executes pinned Python/uv
# binaries, installs a hashed dependency fixture, and builds a synthetic vLLM wheel. Public PR CI remains source-level only.
  push:
    branches: [main]
    paths:
      - 'bootstrap-dependencies.ps1'
      - 'bootstrap-venv.ps1'
      - 'bootstrap-python.ps1'
      - 'bootstrap-uv.ps1'
      - 'scripts/common.ps1'
      - 'manifests/bootstrap/cpython-3.13.15-windows-x86_64.json'
      - 'manifests/bootstrap/uv-0.12.13-windows-x86_64.json'
      - 'manifests/bootstrap/venv-v0.27.1-windows-x86_64.json'
      - 'manifests/runtime/dependencies-v0.27.1-windows-x86_64.json'
      - 'requirements/runtime-v0.27.1.lock.txt'
      - 'tests/fixtures/runtime-dependencies-colorama.lock.txt'
      - 'tests/fixtures/runtime-dependencies-colorama-bad-hash.lock.txt'
      - 'bootstrap-vllm.ps1'
      - 'manifests/runtime/vllm-runtime-v0.27.1-windows-x86_64.json'
      - 'manifests/runtime/vllm-runtime-packages-v0.27.1-windows-x86_64.json'
      - 'requirements/vllm-runtime-v0.27.1.in'
      - 'requirements/vllm-runtime-v0.27.1.lock.txt'
      - 'tests/runtime-vllm-materialization.ps1'
      - '.github/workflows/runtime-vllm-materialization.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime-vllm-materialization:
    name: Managed vLLM runtime materialization regression
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Acquire pinned prerequisites
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'vllm-runtime-final-prereqs'
          $python = (& ./bootstrap-python.ps1 -InstallationRoot $root -Json) | ConvertFrom-Json
          $uv = (& ./bootstrap-uv.ps1 -InstallationRoot $root -Json) | ConvertFrom-Json
          if (-not $python.ready -or -not $uv.ready) { throw 'Pinned prerequisite bootstrap did not report ready.' }
          "VLLM_CPYTHON_ARCHIVE=$($python.archive)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VLLM_UV_ARCHIVE=$($uv.archive)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VLLM_VLLM_PREREQ_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VLLM_VLLM_TEST_ROOT=$($env:RUNNER_TEMP)\vllm-runtime-final-regression" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run PowerShell 7 and Windows PowerShell 5.1 regression
        shell: pwsh
        run: |
          & pwsh.exe -NoLogo -NoProfile -File ./tests/runtime-vllm-materialization.ps1 -PythonArchivePath $env:VLLM_CPYTHON_ARCHIVE -UvArchivePath $env:VLLM_UV_ARCHIVE -ScratchRoot $env:VLLM_VLLM_TEST_ROOT
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 7 managed vLLM runtime regression failed with exit $LASTEXITCODE." }
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ./tests/runtime-vllm-materialization.ps1 -PythonArchivePath $env:VLLM_CPYTHON_ARCHIVE -UvArchivePath $env:VLLM_UV_ARCHIVE -ScratchRoot $env:VLLM_VLLM_TEST_ROOT
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell 5.1 managed vLLM runtime regression failed with exit $LASTEXITCODE." }

      - name: Clean trusted test root
        if: always()
        shell: pwsh
        run: |
          foreach ($path in @($env:VLLM_VLLM_PREREQ_ROOT, $env:VLLM_VLLM_TEST_ROOT)) {
            if ([string]::IsNullOrWhiteSpace($path)) { continue }
            if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Stop }
            if (Test-Path -LiteralPath $path) { throw "Trusted regression cleanup failed: $path" }
          }
